<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Cursor - Security Verification</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <style>
        /* 💥 AIR CURSOR MATTE LOGO THEME VARIABLES 💥 */
        :root {
            --bg-matte: #07090E;
            --card-matte: #0D1322;
            --box-matte: #080D18;
            --border-matte: rgba(37, 99, 235, 0.28);
            --border-hover: rgba(37, 99, 235, 0.6);
            --blue-matte: #2563EB;
            --blue-hover: #1D4ED8;
            --cyan-matte: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --error-matte: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-matte);
            background-image: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, rgba(7, 9, 14, 1) 85%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        /* 💥 MATTE DARK CARD 💥 */
        .matte-security-card {
            background: var(--card-matte);
            border: 1px solid var(--border-matte);
            border-radius: 26px;
            width: 100%;
            max-width: 440px;
            padding: 38px 32px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* LOGO BADGE */
        .logo-badge-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.35);
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }

        .logo-badge-img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--cyan-matte);
        }

        p.subtitle {
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 26px;
            padding: 0 10px;
        }

        /* 💥 CAPTCHA DISPLAY BOX (MATTE ELECTRIC CYAN) 💥 */
        .captcha-display-box {
            background: var(--box-matte);
            border: 1px dashed var(--border-matte);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
            min-height: 62px;
        }

        .captcha-code-text {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 9px;
            color: var(--cyan-matte);
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
            text-decoration: line-through;
            text-decoration-thickness: 2.5px;
            text-decoration-color: rgba(37, 99, 235, 0.8);
            font-family: 'Courier New', Courier, monospace;
            padding-left: 9px;
        }

        .refresh-btn {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            color: var(--cyan-matte);
            background: rgba(37, 99, 235, 0.15);
            transform: rotate(90deg);
        }

        .refresh-btn svg {
            width: 19px;
            height: 19px;
        }

        /* 💥 MATTE INPUT BOX 💥 */
        .matte-input-wrap {
            margin-bottom: 20px;
        }

        .matte-input {
            width: 100%;
            background: var(--box-matte);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            outline: none;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .matte-input::placeholder {
            color: rgba(148, 163, 184, 0.45);
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .matte-input:focus {
            border-color: var(--blue-matte);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            background: #0B1120;
        }

        /* 💥 MATTE ELECTRIC BLUE BUTTON 💥 */
        .matte-submit-btn {
            width: 100%;
            background: var(--blue-matte);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 24px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
        }

        .matte-submit-btn:hover {
            background: var(--blue-hover);
            transform: translateY(-1.5px);
            box-shadow: 0 10px 26px rgba(37, 99, 235, 0.45);
        }

        .matte-submit-btn:active {
            transform: translateY(0);
        }

        /* ERROR MESSAGE */
        .error-msg {
            color: var(--error-matte);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 14px;
            display: none;
        }

        /* SHAKE ANIMATION ON WRONG INPUT */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); }
            40%, 80% { transform: translateX(7px); }
        }

        .shake-effect {
            animation: shake 0.35s ease;
            border-color: var(--error-matte) !important;
        }
    </style>
</head>
<body>

    <div class="matte-security-card">
        <!-- AIR CURSOR LOGO BADGE -->
        <div class="logo-badge-wrap">
            <img src="{{ url_for('static', filename='favicon.png') }}" alt="Air Cursor Logo" class="logo-badge-img">
        </div>

        <h1>Air Cursor <span>Security Gate</span></h1>
        <p class="subtitle">Please enter the security verification code displayed below to access the platform.</p>

        <!-- CAPTCHA CODE CONTAINER -->
        <div class="captcha-display-box">
            <span class="captcha-code-text" id="captchaText">{{ captcha_code }}</span>
            <button type="button" class="refresh-btn" id="refreshBtn" title="Get New Code" aria-label="Refresh Code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19"/>
                </svg>
            </button>
        </div>

        <!-- FORM INPUT -->
        <form id="captchaForm" onsubmit="handleVerification(event)">
            <div class="matte-input-wrap">
                <input 
                    type="text" 
                    id="captchaInput" 
                    class="matte-input" 
                    placeholder="ENTER CODE" 
                    maxlength="6" 
                    autocomplete="off" 
                    autofocus 
                    required
                >
            </div>

            <button type="submit" id="verifyBtn" class="matte-submit-btn">
                <span>Verify & Enter</span>
            </button>
        </form>

        <p id="errorMsg" class="error-msg">Incorrect Code! Please try again.</p>
    </div>

    <script>
        const captchaInput = document.getElementById('captchaInput');
        const captchaText = document.getElementById('captchaText');
        const refreshBtn = document.getElementById('refreshBtn');
        const errorMsg = document.getElementById('errorMsg');
        const verifyBtn = document.getElementById('verifyBtn');

        // Refresh Captcha
        async function fetchNewCaptcha() {
            try {
                const res = await fetch('/api/captcha/new');
                const data = await res.json();
                if (data.status === 'success') {
                    captchaText.textContent = data.captcha;
                    captchaInput.value = '';
                    errorMsg.style.display = 'none';
                    captchaInput.classList.remove('shake-effect');
                    captchaInput.focus();
                }
            } catch (err) {
                console.error("Refresh error:", err);
            }
        }

        refreshBtn.addEventListener('click', fetchNewCaptcha);

        // Verification Handler
        async function handleVerification(e) {
            e.preventDefault();
            const val = captchaInput.value.trim().toUpperCase();
            if (!val) return;

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = "<span>Verifying...</span>";

            try {
                const res = await fetch('/verify-captcha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ captcha: val })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // Success: Redirect to Main Landing Page
                    window.location.href = '/';
                } else {
                    // Failure: Show Error and Shake Input
                    errorMsg.textContent = data.message || "Incorrect Code! Please try again.";
                    errorMsg.style.display = 'block';
                    captchaInput.classList.add('shake-effect');
                    if (data.new_captcha) {
                        captchaText.textContent = data.new_captcha;
                    }
                    captchaInput.value = '';
                    setTimeout(() => {
                        captchaInput.classList.remove('shake-effect');
                    }, 400);
                    captchaInput.focus();
                }
            } catch (err) {
                errorMsg.textContent = "Server connection error. Please try again.";
                errorMsg.style.display = 'block';
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = "<span>Verify & Enter</span>";
            }
        }
    </script>
</body>
</html>
