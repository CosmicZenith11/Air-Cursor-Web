<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 💥 GITHUB STYLE TAB TITLE (MIDDLE DOT + APP NAME) 💥 -->
    <title>{% if code == 404 or code == '404' %}Page not found{% elif code == 500 or code == '500' %}Server error{% elif code == 403 or code == '403' %}Access restricted{% else %}{{ title }}{% endif %} · Air Cursor</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #141517;
            color: #E6E4E0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .error-card {
            background: rgba(31, 33, 36, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(197, 168, 128, 0.35);
            border-radius: 28px;
            padding: 50px 35px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 25px rgba(197, 168, 128, 0.12);
        }
        .error-code {
            font-size: 4.5rem;
            font-weight: 800;
            color: #C5A880;
            margin-bottom: 8px;
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(197, 168, 128, 0.4);
        }
        h1 {
            font-size: 1.65rem;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 0.98rem;
            line-height: 1.65;
            color: rgba(230, 228, 224, 0.78);
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 32px;
            background: linear-gradient(135deg, #C5A880 0%, #E6E4E0 100%);
            color: #141517;
            font-weight: 700;
            text-decoration: none;
            border-radius: 99px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(197, 168, 128, 0.25);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(197, 168, 128, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a href="/" class="btn-home">Return to Home</a>
    </div>
</body>
</html>
